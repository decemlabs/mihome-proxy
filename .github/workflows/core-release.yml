name: Mihomo core release

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish even when the Mihomo version is unchanged
        type: boolean
        default: false

concurrency:
  group: mihomo-core-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Packages/EverywhereCore/go/go.mod
          cache: true
          cache-dependency-path: Packages/EverywhereCore/go/go.sum

      - name: Detect Mihomo version
        id: versions
        working-directory: Packages/EverywhereCore/go
        run: |
          set -euo pipefail
          current=$(go list -m -f '{{.Version}}' github.com/metacubex/mihomo)
          latest=$(curl -fsSL \
            https://proxy.golang.org/github.com/metacubex/mihomo/@latest \
            | jq -r '.Version')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$current" == "$latest" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to release
        id: proceed
        run: |
          if [[ "${{ steps.versions.outputs.changed }}" == "true" \
            || "${{ inputs.force_release }}" == "true" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Mihomo is current; no release needed."
          fi

      - name: Update Mihomo
        if: steps.proceed.outputs.release == 'true'
        working-directory: Packages/EverywhereCore/go
        run: |
          set -euo pipefail
          go get \
            github.com/metacubex/mihomo@${{ steps.versions.outputs.latest }}
          go mod tidy
          go mod verify
          go test ./...
          if go list -m all | grep -Eq \
            'github\.com/(sagernet/sing-box|xtls/xray-core)( |$)'; then
            echo "Forbidden proxy core dependency found" >&2
            exit 1
          fi

      - name: Build XCFramework
        if: steps.proceed.outputs.release == 'true'
        run: Packages/EverywhereCore/Scripts/build.sh

      - name: Select release tag
        if: steps.proceed.outputs.release == 'true'
        id: tag
        run: |
          set -euo pipefail
          base="core-v$(date -u +%Y.%m.%d)"
          tag="$base"
          suffix=1
          while git rev-parse --verify --quiet "refs/tags/$tag"; do
            tag="$base.$suffix"
            suffix=$((suffix + 1))
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Archive and update package
        if: steps.proceed.outputs.release == 'true'
        id: artifact
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          core=Packages/EverywhereCore
          zip="$core/EverywhereCore-$tag.xcframework.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$core/EverywhereCore.xcframework" "$zip"
          checksum=$(swift package compute-checksum "$zip")
          "$core/Scripts/render-package.sh" "$tag" "$checksum"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.proceed.outputs.release == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Packages/EverywhereCore/Package.swift \
            Packages/EverywhereCore/go/go.mod \
            Packages/EverywhereCore/go/go.sum
          git commit -m "Release $tag"
          git tag -a "$tag" -m "$tag"
          git push origin \
            "HEAD:${{ github.event.repository.default_branch }}" "$tag"

      - name: Publish release
        if: steps.proceed.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          notes_file="$RUNNER_TEMP/core-release-notes.md"
          {
            echo "Mihomo-only EverywhereCore"
            echo
            echo "Mihomo: ${{ steps.versions.outputs.current }} → ${{ steps.versions.outputs.latest }}"
            echo "SwiftPM checksum: ${{ steps.artifact.outputs.checksum }}"
          } > "$notes_file"
          gh release create "$tag" \
            "${{ steps.artifact.outputs.zip }}" \
            --title "$tag" \
            --notes-file "$notes_file"

      - name: Smoke-build Mihome Proxy
        if: steps.proceed.outputs.release == 'true'
        run: |
          set -euo pipefail
          ruby Scripts/wire_project.rb
          xcodebuild \
            -project Everywhere.xcodeproj \
            -scheme Everywhere \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
