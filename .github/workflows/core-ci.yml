name: Mihomo core CI

on:
  pull_request:
    paths:
      - "Packages/MihomeCore/**"
      - ".github/workflows/core-*.yml"
  push:
    branches:
      - main
    paths:
      - "Packages/MihomeCore/**"
      - ".github/workflows/core-*.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: Packages/MihomeCore/go/go.mod
          cache: true
          cache-dependency-path: Packages/MihomeCore/go/go.sum

      - name: Verify Go module
        working-directory: Packages/MihomeCore/go
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
          go test ./...
          if go list -m all | grep -Eq \
            'github\.com/(sagernet/sing-box|xtls/xray-core)( |$)'; then
            echo "Forbidden proxy core dependency found" >&2
            exit 1
          fi

      - name: Build XCFramework
        run: Packages/MihomeCore/Scripts/build.sh

      - name: Validate slices and package
        run: |
          set -euo pipefail
          plist=Packages/MihomeCore/MihomeCore.xcframework/Info.plist
          plutil -p "$plist" | grep -q '"LibraryIdentifier" => "ios-arm64"'
          plutil -p "$plist" | grep -q \
            '"LibraryIdentifier" => "ios-arm64_x86_64-simulator"'
          test "$(MIHOME_LOCAL_CORE=1 swift package \
            --package-path Packages/MihomeCore dump-package \
            | jq -r '.name')" = "MihomeCore"

      - name: Report sizes
        run: |
          du -sh Packages/MihomeCore/MihomeCore.xcframework
          find Packages/MihomeCore/MihomeCore.xcframework \
            -type f -name MihomeCore -exec ls -lh {} \;
